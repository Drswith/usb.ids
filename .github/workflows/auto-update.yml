name: Auto Update USB.IDS

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: auto-update
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      update_mode:
        description: "auto (plan: resume or update), force (always refresh data), dry-run (fetch+build only, no publish)"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - force
          - dry-run

jobs:
  auto-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install

      - name: Plan fetch and publish
        id: plan
        run: |
          set -e
          EVENT="${{ github.event_name }}"
          MODE="${{ github.event.inputs.update_mode }}"
          [ -z "$MODE" ] && MODE=auto
          IS_DRY=false
          FETCH_FORCE=false
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$MODE" = "dry-run" ]; then
            IS_DRY=true
          fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$MODE" = "force" ]; then
            FETCH_FORCE=true
          fi
          echo "is_dry_run=$IS_DRY" >> "$GITHUB_OUTPUT"
          echo "fetch_force=$FETCH_FORCE" >> "$GITHUB_OUTPUT"

          if [ "$FETCH_FORCE" = "true" ]; then
            PLAN_JSON=$(pnpm --filter "./packages/cli" exec tsx scripts/update-plan.ts --json --force)
          else
            PLAN_JSON=$(pnpm --filter "./packages/cli" exec tsx scripts/update-plan.ts --json)
          fi
          echo "$PLAN_JSON"

          # Dry-run may fetch and build, but it never publishes.
          printf '%s' "$PLAN_JSON" | IS_DRY="$IS_DRY" node -e '
            let data = "";
            process.stdin.on("data", (chunk) => (data += chunk));
            process.stdin.on("end", () => {
              const plan = JSON.parse(data);
              const dry = process.env.IS_DRY === "true";
              const dataChanged = plan.data_changed === true;
              const publishPending = !dry && plan.publish_pending === true;
              if (plan.stale_source === true) {
                console.log("::warning::Upstream view is older than the checked-in release manifest; skipping data refresh to avoid a downgrade.");
              }
              console.log(`data_changed=${dataChanged}`);
              console.log(`publish_pending=${publishPending}`);
              console.log(`run_pipeline=${dataChanged || publishPending}`);
            });
          ' >> "$GITHUB_OUTPUT"

      - name: Fetch USB IDs
        if: steps.plan.outputs.data_changed == 'true'
        run: |
          if [ "${{ steps.plan.outputs.fetch_force }}" = "true" ]; then
            pnpm --filter "./packages/cli" exec tsx src/cli.ts fetch --force
          else
            pnpm run fetch-usb-ids
          fi

      - name: Full build (lib, data artefacts, UI)
        if: steps.plan.outputs.run_pipeline == 'true'
        run: pnpm run build

      - name: Upload build artifacts
        if: steps.plan.outputs.run_pipeline == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: usb-ids-build-${{ github.run_number }}
          path: |
            packages/cli/dist/
            packages/cli/usb.ids
            packages/cli/usb.ids.json
            packages/cli/usb.ids.version.json
          retention-days: 30

      - name: Update package versions for publish
        if: steps.plan.outputs.data_changed == 'true' && steps.plan.outputs.is_dry_run != 'true'
        run: |
          NEW_VERSION=$(node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('./packages/cli/usb.ids.version.json', 'utf8'));
          const releaseVersion = typeof manifest.releaseVersion === 'string' ? manifest.releaseVersion.trim() : '';
          if (!/^\d+\.\d{8}\.\d+$/.test(releaseVersion)) {
            throw new Error(`Expected normalized releaseVersion in packages/cli/usb.ids.version.json, got ${JSON.stringify(manifest.releaseVersion ?? manifest.version ?? null)}`);
          }
          process.stdout.write(releaseVersion.replace(/^v/, ''));
          NODE
          )
          echo "New version: $NEW_VERSION"

          CURRENT_RELEASE=$(git show "HEAD:packages/cli/usb.ids.version.json" 2>/dev/null | node -e "
            let data = '';
            process.stdin.on('data', (chunk) => (data += chunk));
            process.stdin.on('end', () => {
              try { process.stdout.write(String(JSON.parse(data).releaseVersion ?? '')); } catch {}
            });
          ")
          if [ -n "$CURRENT_RELEASE" ]; then
            if ! node -e "
              const compareCalVer = (a, b) => {
                const pa = a.split('.').map(Number);
                const pb = b.split('.').map(Number);
                for (let i = 0; i < Math.max(pa.length, pb.length); i += 1) {
                  const x = pa[i] ?? 0;
                  const y = pb[i] ?? 0;
                  if (x !== y) return x < y ? -1 : 1;
                }
                return 0;
              };
              const current = process.argv[1];
              const next = process.argv[2];
              if (compareCalVer(next, current) < 0) {
                console.error(\`Fetched data resolves to \${next}, older than the released \${current} (likely a stale upstream mirror).\`);
                process.exit(1);
              }
            " "$CURRENT_RELEASE" "$NEW_VERSION"; then
              echo "::error::Refusing release version downgrade ($NEW_VERSION < $CURRENT_RELEASE). Aborting before commit."
              exit 1
            fi
          fi

          node -e "
            const fs = require('fs');
            const targets = [
              './packages/cli/package.json'
            ];
            for (const file of targets) {
              if (!fs.existsSync(file)) continue;
              const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
              pkg.version = '$NEW_VERSION';
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
            }
          "

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add packages/cli/package.json packages/cli/usb.ids packages/cli/usb.ids.json packages/cli/usb.ids.version.json
          git commit -m "chore: update to version $NEW_VERSION

          - Automated data and CalVer bump"

      - name: Create and push tag
        if: steps.plan.outputs.publish_pending == 'true'
        run: |
          set -e
          TAG_VERSION=$(node -p "String(require('./packages/cli/package.json').version).replace(/^v/, '')")
          echo "Release tag: v$TAG_VERSION"
          HEAD_SHA=$(git rev-parse HEAD)

          push_with_retry() {
            REFSPEC="$1"
            ATTEMPTS=3
            i=1
            while [ "$i" -le "$ATTEMPTS" ]; do
              if git push origin "$REFSPEC"; then
                return 0
              fi
              if [ "$i" -eq "$ATTEMPTS" ]; then
                echo "::error::Push of $REFSPEC failed after $ATTEMPTS attempts."
                return 1
              fi
              SLEEP=$((i * 30))
              echo "Push of $REFSPEC attempt $i failed; retrying in ${SLEEP}s..."
              sleep "$SLEEP"
              i=$((i + 1))
            done
          }

          REMOTE_TAGS=$(git ls-remote --tags origin)
          TAG_LINE=$(printf '%s\n' "$REMOTE_TAGS" | awk -v t="refs/tags/v$TAG_VERSION" '$2 == t')
          if [ -n "$TAG_LINE" ]; then
            REMOTE_TAG_COMMIT=$(printf '%s\n' "$REMOTE_TAGS" | awk -v t="refs/tags/v$TAG_VERSION^{}" '$2 == t {print $1}')
            if [ -z "$REMOTE_TAG_COMMIT" ]; then
              REMOTE_TAG_COMMIT=$(printf '%s' "$TAG_LINE" | awk '{print $1}')
            fi
            if git merge-base --is-ancestor "$REMOTE_TAG_COMMIT" "$HEAD_SHA"; then
              echo "Tag v$TAG_VERSION already exists at $REMOTE_TAG_COMMIT (within released history, HEAD $HEAD_SHA); skipping creation and push."
            else
              echo "::error::Tag v$TAG_VERSION exists at ${REMOTE_TAG_COMMIT:-unknown}, which is not part of the current history (HEAD $HEAD_SHA). Refusing to move a release tag."
              exit 1
            fi
          else
            git tag -a "v$TAG_VERSION" -m "Release v$TAG_VERSION"
            if [ "${{ steps.plan.outputs.data_changed }}" = "true" ]; then
              push_with_retry "main"
            fi
            push_with_retry "v$TAG_VERSION"
          fi

      - name: Generate changelog
        if: steps.plan.outputs.publish_pending == 'true'
        run: |
          TAG_VERSION=$(node -p "String(require('./packages/cli/package.json').version).replace(/^v/, '')")
          if gh release view "v$TAG_VERSION" > /dev/null 2>&1; then
            echo "GitHub release for v$TAG_VERSION already exists; skipping changelog generation."
          else
            pnpm dlx changelogithub@15.0.5 --to "v$TAG_VERSION"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish CLI package to npm (trusted publishing via OIDC)
        if: steps.plan.outputs.publish_pending == 'true'
        run: pnpm --filter "./packages/cli" publish --access public --provenance --no-git-checks

  notify-failure:
    runs-on: ubuntu-latest
    needs: [auto-update]
    if: ${{ always() && needs.auto-update.result == 'failure' }}
    permissions:
      issues: write
    steps:
      - name: Report failure as GitHub issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = `**Auto Update USB.IDS** workflow failed.

            - Run: ${context.runId}
            - [Open workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[auto-update] failed (${new Date().toISOString().slice(0, 10)} #${context.runId})`,
              body,
            });
